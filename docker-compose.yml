version: "3.8"

services:
  # ==================== MySQL 服务 ====================
  mysql:
    image: mysql:8.0
    container_name: sysadmin-mysql
    restart: always
    environment:
      # root 用户密码（请按需修改，并务必与下方 web 服务的 JDBC_PASSWORD 保持一致）
      MYSQL_ROOT_PASSWORD: "123456"
      # 若 ./sql/init.sql 里未创建数据库，可在此自动创建一个（库名需与 JDBC_URL 中一致）
      MYSQL_DATABASE: sysadmin
    ports:
      # 仅供宿主机本地调试用，可整行注释；容器间通信用服务名 mysql，不走宿主机端口
      - "3306:3306"
    volumes:
      # 把宿主机的初始化 SQL 挂到 MySQL 官方镜像的初始化目录，首次启动自动执行
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # 持久化数据，避免容器删除后数据丢失
      - mysql_data:/var/lib/mysql
    # 关键：兼容老版本 MySQL JDBC 驱动（caching_sha2_password -> mysql_native_password）
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sysadmin-net

  # ==================== Web（SysAdmin 应用）服务 ====================
  web:
    # 基于当前目录的 Dockerfile 构建镜像
    build: .
    container_name: sysadmin-web
    restart: always
    # 等 MySQL 真正就绪（healthcheck 通过）后再启动 web，避免应用启动时连不上库
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # 关键：Docker 网络内不能用 localhost，必须用服务名 mysql 作为数据库主机地址
      # 该变量会覆盖 jdbc.properties 中的 JDBC_URL（Spring <context:property-placeholder> 支持读取环境变量）
      - JDBC_URL=jdbc:mysql://mysql:3306/sysadmin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      - JDBC_USERNAME=root
      - JDBC_PASSWORD=123456
    networks:
      - sysadmin-net

networks:
  sysadmin-net:
    driver: bridge

volumes:
  mysql_data:
