# ==================== MySQL 8.0 ====================
jdbc.driver=com.mysql.cj.jdbc.Driver
# 本地未设置环境变量时使用后面的默认值（localhost）；Docker 部署时由 docker-compose 注入 JDBC_URL 覆盖
jdbc.url=${JDBC_URL:jdbc:mysql://127.0.0.1:3306/sysadmin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
jdbc.username=${JDBC_USERNAME:root}
jdbc.password=${JDBC_PASSWORD:123456}

# ==================== Druid 连接池 ====================
druid.initialSize=5
druid.minIdle=5
druid.maxActive=50
druid.maxWait=60000
druid.timeBetweenEvictionRunsMillis=60000
druid.minEvictableIdleTimeMillis=300000
druid.validationQuery=SELECT 1
druid.testWhileIdle=true
druid.testOnBorrow=false
druid.testOnReturn=false
